name: APK oluştur

on:
  push:
    branches: ['**', '!ci-log']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: APK derle
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log

      # Derleme hatasında günlüğü ci-log dalına yaz (Claude okuyup düzeltebilsin)
      - name: Hata günlüğünü kaydet
        if: failure()
        shell: bash
        run: |
          { grep -E "^e: |error:|What went wrong|FAILURE" -A4 build.log || true; echo; echo ----- SON 150 SATIR -----; tail -150 build.log; } > errors.txt
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-log
          git rm -rf --cached . > /dev/null
          echo "run ${{ github.run_number }} ${{ github.sha }}" > run.txt
          git add -f errors.txt run.txt
          git commit -m "derleme hatası ${{ github.run_number }}"
          git push -f origin HEAD:ci-log

      - name: APK adını düzenle
        run: cp app/build/outputs/apk/release/app-release.apk KitapAtolyesi-v1.0.${{ github.run_number }}.apk

      - name: Deneme APK'sı
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: KitapAtolyesi-deneme
          path: KitapAtolyesi-v1.0.${{ github.run_number }}.apk

      - name: Sürüm yayınla
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kitap Atölyesi v1.0.${{ github.run_number }}
          body: "Telefonda veya tablette bu sayfayı aç, aşağıdaki .apk dosyasına dokun ve kur."
          files: KitapAtolyesi-v1.0.${{ github.run_number }}.apk
          make_latest: true
